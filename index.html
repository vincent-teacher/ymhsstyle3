      <button class="r-btn" id="rFull" title="全螢幕"><svg><use href="#i-full"/></svg></button>

      <button class="r-nav next" id="rNext" title="下一版 (→)"><svg><use href="#i-right"/></svg></button>

      <div class="r-lines" id="rLines"></div>
    </aside>
  </div>

    <div class="set-row"><div><b>文字大小</b><small>調整全站字體</small></div>
      <div class="seg" id="setFont"><button data-v="s">小</button><button data-v="m">中</button><button data-v="l">大</button><button data-v="xl">特大</button></div></div>
    <label class="set-row"><div><b>互動音效</b><small>點擊、翻頁、答題音效</small></div><input type="checkbox" class="sw" id="setSound"></label>
    <div class="set-row"><div><b>音量</b><small>音效大小</small></div><input type="range" id="setVol" min="0" max="100"></div>
    <label class="set-row"><div><b>背景輕音樂</b><small>五聲音階環境音（瀏覽器即時合成）</small></div><input type="checkbox" class="sw" id="setMusic"></label>
    <label class="set-row"><div><b>飄落梅花</b><small>背景梅花花瓣動畫</small></div><input type="checkbox" class="sw" id="setPetals"></label>
    <label class="set-row"><div><b>動畫效果</b><small>關閉可減少畫面移動</small></div><input type="checkbox" class="sw" id="setAnim"></label>
    <label class="set-row"><div><b>深色模式</b><small>夜間閱讀較不刺眼</small></div><input type="checkbox" class="sw" id="setDark"></label>
    <label class="set-row"><div><b>閱讀時顯示文字面板</b><small>開啟版面時同時顯示辨識文字</small></div><input type="checkbox" class="sw" id="setText"></label>
    <button class="btn ghost" id="setReset">清除我的閱讀紀錄與收藏</button>
